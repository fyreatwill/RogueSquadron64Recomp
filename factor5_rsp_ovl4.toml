# s47: main ucode translated from a composite ROM whose IMEM window region
# (ROM 0x26340..0x2655F, IMEM 0x1DB0..0x1FCF) holds the REAL clip overlay
# (overlay id 4) instead of the packed overlay-image storage the shipped ROM
# keeps there. Only the window-region labels of this output are used — they
# are renamed CLIP_* and spliced into factor5_ucode_recompiled.c by
# tools/fixup_factor5_ucode.py (fixup 6). Source image: ROM 0x26420..0x2663F,
# byte-identical to the runtime RDRAM capture (s47 imem_dma_dump control).
rom_file_path = "scratch/s47_clip_composite.z64"
text_offset = 0x025610
text_size = 0xF80
text_address = 0x04001080
output_file_path = "build/factor5_ucode/factor5_ucode_ovl4_recompiled.c"
output_function_name = "factor5_ucode_ovl4"

# Same dispatch-table targets as factor5_rsp.toml — the resident code is
# identical in the composite, and 0x1DB0 is the window entry — plus the clip
# overlay's register-loaded return addresses (s47): `ori $ra, 0x1E1C` (x2)
# and `ori $30, 0x1E54` (consumed by resident L_1650), which resident code
# returns to via jr, so they need labels AND dispatch cases.
extra_indirect_branch_targets = [
    0x10D8, 0x10E0, 0x12A0, 0x12B8, 0x12C4, 0x12E4, 0x12EC, 0x12FC,
    0x1304, 0x1350, 0x135C, 0x1370, 0x1390, 0x146C, 0x1484, 0x14D4,
    0x14F0, 0x1504, 0x15A4, 0x15AC, 0x15B4, 0x1DB0, 0x1E1C, 0x1E54
]
