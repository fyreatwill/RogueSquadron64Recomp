# Resident overlay 12 (id 0x0C) input. The composite puts its ROM image in
# the shared IMEM window so RSPRecomp can translate L_1DB0 as TriGen code.
# Only the window-region labels are used — they are renamed OVL12_* and
# spliced into factor5_ucode_recompiled.c by fixup 6b. Source image:
# ROM 0x26670..0x2689F, byte-identical to the s47 RDRAM capture.
rom_file_path = "scratch/s47_trigen_composite.z64"
text_offset = 0x025610
text_size = 0xF80
text_address = 0x04001080
output_file_path = "build/factor5_ucode/factor5_ucode_ovl12_recompiled.c"
output_function_name = "factor5_ucode_ovl12"

# Same resident dispatch-table targets as the main/ovl4 configs, plus the
# overlay-12 jal-return addresses consumed by L_122C and L_1FD4 (jr $ra).
extra_indirect_branch_targets = [
    0x10D8, 0x10E0, 0x12A0, 0x12B8, 0x12C4, 0x12E4, 0x12EC, 0x12FC,
    0x1304, 0x1350, 0x135C, 0x1370, 0x1390, 0x146C, 0x1484, 0x14D4,
    0x14F0, 0x1504, 0x15A4, 0x15AC, 0x15B4, 0x1DB0,
    0x1DD8, 0x1DF4, 0x1F9C, 0x1FAC, 0x1FBC, 0x1FCC
]
