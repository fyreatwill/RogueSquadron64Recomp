# Resident overlay 18 (id 0x18) input. The composite puts its ROM image in
# the shared IMEM window so RSPRecomp can translate L_1DB0 as the ovl14
# successor vector loop. Only the window-region labels are used — they
# are renamed OVL18_* and spliced into factor5_ucode_recompiled.c by
# fixup 6h. Source image: ROM 0x26CD8, table length 0x21F -> 0x220 bytes,
# dest IMEM 0x1DB0. Exit: j L_1268; ori $5, 0x10. Internal jals return
# to 0x1EEC / 0x1F40. 0x1EEC is already an ovl14-only case — 6h widens
# it; do not overwrite. Do not splice overlay 0x10 here.
rom_file_path = "scratch/s47_ovl18_composite.z64"
text_offset = 0x025610
text_size = 0xF80
text_address = 0x04001080
output_file_path = "build/factor5_ucode/factor5_ucode_ovl18_recompiled.c"
output_function_name = "factor5_ucode_ovl18"

# Same resident dispatch-table targets as the main/ovl14 configs, plus
# the overlay-18 jal-return / helper / internal-jump addresses.
extra_indirect_branch_targets = [
    0x10D8, 0x10E0, 0x12A0, 0x12B8, 0x12C4, 0x12E4, 0x12EC, 0x12FC,
    0x1304, 0x1350, 0x135C, 0x1370, 0x1390, 0x146C, 0x1484, 0x14D4,
    0x14F0, 0x1504, 0x15A4, 0x15AC, 0x15B4, 0x1DB0,
    0x1EEC, 0x1F40, 0x1F48, 0x1F5C, 0x1F64
]
